# Experimental: use the triggering request's resolved provider/model/effort.
- id: rice-patrol
  disabled: false
  config:
    mode: recover
    provider: '*'
    model: '*'
    stateDirectory: /absolute/path/to/research-guard-state
    stopTimeoutMs: 10000
    compactTimeoutMs: 45000
    resumeTimeoutMs: 300000
    alwaysCompact: true
